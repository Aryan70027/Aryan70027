<svg xmlns="http://www.w3.org/2000/svg" width="960" height="218" viewBox="0 0 960 218" role="img" aria-labelledby="title desc">
  <title id="title">EduWindow</title>
  <desc id="desc">Institutional operating system. One vision, one mission, one window.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#072b57"/><stop offset=".6" stop-color="#1048a1"/><stop offset="1" stop-color="#2a2785"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#69f2e4"/><stop offset="1" stop-color="#aaacff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#33ceff" stop-opacity=".48"/><stop offset="1" stop-color="#33ceff" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="1" y="1" width="958" height="216" rx="22"/></clipPath>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif}.float{animation:float 8s ease-in-out infinite}.flow{animation:flow 14s linear infinite}
      @keyframes float{50%{transform:translateY(-7px)}}@keyframes flow{to{stroke-dashoffset:-240}}
      @media(prefers-reduced-motion:reduce){.float,.flow{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
