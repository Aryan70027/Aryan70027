    <ellipse cx="730" cy="60" rx="240" ry="180" fill="url(#glow)"/>
    <path d="M590 230C650 90 770 280 970 30M560-10C700 200 840-30 980 150" fill="none" stroke="#82c7ff" stroke-opacity=".2"/>
    <path class="flow" d="M610 180C760 50 810 220 995 65" fill="none" stroke="url(#line)" stroke-width="2" stroke-dasharray="5 19" opacity=".5"/>
    <text x="38" y="42" fill="#a1e2ff" font-size="13" font-weight="650" letter-spacing="3">EDUCATION / CONNECTED</text>
    <text x="34" y="108" fill="#ffffff" font-size="55" font-weight="750" letter-spacing="-1.5">EduWindow<tspan fill="#68f4df">.</tspan></text>
    <text x="38" y="147" fill="#e0edff" font-size="24">One vision. One mission. One window.</text>
    <text x="38" y="185" fill="#b9d8ff" font-size="15">INSTITUTIONAL OPERATING SYSTEM</text>
    <g class="float" aria-hidden="true">
      <rect x="732" y="34" width="154" height="154" rx="34" transform="rotate(-9 809 111)" fill="#9ac7ff" fill-opacity=".09" stroke="#bce8ff" stroke-opacity=".35"/>
      <rect x="749" y="49" width="124" height="124" rx="29" fill="#122b79" fill-opacity=".65" stroke="#a2ceff" stroke-opacity=".35"/>
      <g fill="none" stroke="#c8f8ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M775 93l36-17 36 17-36 17zM786 104v26c16 9 34 9 50 0v-26M775 93v30"/>
        <path d="M789 146h44M811 117v22" opacity=".7"/>
      </g>
      <circle cx="874" cy="43" r="7" fill="#77f7df"/>
    </g>
  </g>
  <rect x="1" y="1" width="958" height="216" rx="22" fill="none" stroke="#71b8ff" stroke-opacity=".55"/>
