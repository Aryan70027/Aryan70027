<svg xmlns="http://www.w3.org/2000/svg" width="960" height="218" viewBox="0 0 960 218" role="img" aria-labelledby="title desc">
  <title id="title">Zudex</title>
  <desc id="desc">Hyperlocal commerce, connected. Over 5,000 registered users and growing.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2=".8"><stop stop-color="#482139"/><stop offset=".55" stop-color="#73362f"/><stop offset="1" stop-color="#a14d24"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#ffcf70"/><stop offset="1" stop-color="#ffb0c7"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ffbc5a" stop-opacity=".38"/><stop offset="1" stop-color="#ffbc5a" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="1" y="1" width="958" height="216" rx="22"/></clipPath>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif}.float{animation:float 9s ease-in-out infinite}.flow{animation:flow 12s linear infinite}
      @keyframes float{50%{transform:translateY(-7px)}}@keyframes flow{to{stroke-dashoffset:-240}}
      @media(prefers-reduced-motion:reduce){.float,.flow{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="960" height="218" fill="url(#bg)"/>
    <ellipse cx="820" cy="105" rx="300" ry="200" fill="url(#glow)"/>
    <path d="M575 230C705 40 799 279 990 40M650-10L740 79 860 33 980 122" fill="none" stroke="#ffc787" stroke-opacity=".2"/>
    <path class="flow" d="M630 185L724 133 811 154 929 79 997 105" fill="none" stroke="url(#line)" stroke-width="2" stroke-dasharray="5 19" opacity=".6"/>
    <text x="38" y="42" fill="#ffd5b8" font-size="13" font-weight="650" letter-spacing="3">COMMERCE / CONNECTED</text>
    <text x="34" y="108" fill="#fff8ef" font-size="55" font-weight="750" letter-spacing="-1.5">Zudex<tspan fill="#ffc56a">.</tspan></text>
    <text x="38" y="147" fill="#ffe9d9" font-size="24">Local commerce. Growing possibilities.</text>
    <text x="38" y="185" fill="#ffdfb4" font-size="15">5,000+ REGISTERED USERS &amp; GROWING</text>
    <g class="float" aria-hidden="true">
      <rect x="732" y="34" width="154" height="154" rx="34" transform="rotate(9 809 111)" fill="#ffd396" fill-opacity=".1" stroke="#ffdeb5" stroke-opacity=".4"/>
      <rect x="749" y="49" width="124" height="124" rx="29" fill="#653429" fill-opacity=".7" stroke="#ffcc97" stroke-opacity=".4"/>
      <g fill="none" stroke="#ffebc5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M778 90h10l7 40h36l9-30h-50M800 96v-9m17 9v-9M798 142h.1m30 0h.1"/>
        <circle cx="800" cy="143" r="3"/><circle cx="828" cy="143" r="3"/>
      </g>
      <circle cx="745" cy="173" r="7" fill="#ffe1a4"/>
    </g>
  </g>
  <rect x="1" y="1" width="958" height="216" rx="22" fill="none" stroke="#ffaa86" stroke-opacity=".55"/>
</svg>
